        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);

          bytes.push(c);
        } else {

<style>

.choice.on{border-color:var(--sky);background:#0c2a3d}

.go{font-size:1.3rem;padding:.6em 1.2em}

.center{text-align:center}

function norm(s){ return String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').replace(/\s+/g, ' ').trim(); }

  if (!t) { const m = f.match(/^I'm (not )?going to (.*)$/); if (m) return { tiles: m[1] ? ["I'm", 'not', 'going', 'to'] : ["I'm", 'going', 'to'], rest: m[2], pos: 'head' }; return { tiles: [], rest: f, pos: 'head' }; }
  if (f.toLowerCase().startsWith(t.toLowerCase() + ' ')) return { tiles: f.slice(0, t.length).split(' '), rest: f.slice(t.length).trim(), pos: 'head' };

function stripPrefix(arr){ const w = arr.map(t => t.n); const pres = [['im','not','going','to'],['i','am','not','going','to'],['im','going','to'],['i','am','going','to'],['im','gonna'],['im','not','gonna']]; for (const p of pres) if (p.every((x, i) => w[i] === x)) return arr.slice(p.length); return arr; }

let db = null, serverOffset = 0;
const TS = { '.sv': 'timestamp' };

const fbBase = DB_URL.replace(/\/+$/, '');
const pjoin = (...p) => p.join('/').split('/').filter(Boolean).join('/');
const fbUrl = p => `${fbBase}/${p}.json`;
function snapOf(v, key){ return { val: () => v ?? null, exists: () => v != null, key }; }
function setAt(root, parts, val){
  if (!parts.length) return val ?? null;
  const out = (root && typeof root === 'object') ? { ...root } : {};
  const [k, ...rest] = parts;
  const v = setAt(out[k], rest, val);
  if (v == null || (typeof v === 'object' && !Object.keys(v).length)) delete out[k]; else out[k] = v;
  return out;
}
async function fbFetch(path, method = 'GET', body, headers = {}){
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(fbUrl(path), { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
      if (r.status === 412) return r;
      if (!r.ok) { const t = await r.text(); throw new Error(`Firebase ${r.status}: ${t.slice(0, 120)}`); }
      return r;
    } catch (e) { if (i === 2 || /Firebase 4\d\d/.test(e.message)) throw e; await new Promise(res => setTimeout(res, 400 * (i + 1))); }
  }
}
class FbRef {
  constructor(path){ this.path = pjoin(path); this.key = this.path.split('/').pop(); }
  child(p){ return new FbRef(pjoin(this.path, p)); }
  async get(){ const r = await fbFetch(this.path); return snapOf(await r.json(), this.key); }
  set(v){ return fbFetch(this.path, 'PUT', v); }
  update(obj){ return fbFetch(this.path, 'PATCH', obj); }
  remove(){ return fbFetch(this.path, 'DELETE'); }
  push(v){ return fbFetch(this.path, 'POST', v); }
  async transaction(fn){
    for (let i = 0; i < 10; i++) {
      const r = await fbFetch(this.path, 'GET', undefined, { 'X-Firebase-ETag': 'true' });
      const etag = r.headers.get('ETag'), cur = await r.json(), nv = fn(cur);
      if (!etag) { await this.set(nv); return { committed: true, snapshot: snapOf(nv, this.key) }; }
      const w = await fbFetch(this.path, 'PUT', nv, { 'if-match': etag });
      if (w.status !== 412) return { committed: true, snapshot: snapOf(await w.json(), this.key) };
      await new Promise(res => setTimeout(res, 100 + Math.random() * 300));
    }
    throw new Error('transaction failed');
  }
  on(ev, cb){
    let cache = null, es = null, closed = false, timer = null;
    const open = () => {
      if (closed) return;
      es = new EventSource(fbUrl(this.path));
      const apply = (e, patch) => {
        let d; try { d = JSON.parse(e.data); } catch (x) { return; }
        if (!d) return;
        const parts = d.path.split('/').filter(Boolean);
        if (patch) { for (const k in d.data) cache = setAt(cache, [...parts, ...k.split('/').filter(Boolean)], d.data[k]); }
        else cache = setAt(cache, parts, d.data);
        cb(snapOf(cache, this.key));
      };
      es.addEventListener('put', e => apply(e, false));
      es.addEventListener('patch', e => apply(e, true));
      es.addEventListener('cancel', () => { es.close(); });
      es.onerror = () => { if (es.readyState === 2) { clearTimeout(timer); timer = setTimeout(open, 2000); } };

/* ============ 공통: 결과 계산 ============ */
function playersArr(R){ return Object.entries(R?.players || {}).map(([pid, p]) => ({ pid, name: p.name, joined: p.joined || 0, st: p.st || {} })).sort((a, b) => a.joined - b.joined); }
function rankList(ps){
  return [...ps].sort((a, b) => {
    const ea = a.st.escapedAt ? 1 : 0, eb = b.st.escapedAt ? 1 : 0;
    if (ea !== eb) return eb - ea;
    if (ea) return (a.st.order || 999) - (b.st.order || 999);
    if ((b.st.maxProg || 0) !== (a.st.maxProg || 0)) return (b.st.maxProg || 0) - (a.st.maxProg || 0);
    return (a.st.wrong || 0) - (b.st.wrong || 0);
  });
}
function computeResults(R){
  const ps = playersArr(R).filter(p => p.st.started), startAt = R.startAt || 0;
  const esc = ps.filter(p => p.st.escapedAt).sort((a, b) => a.st.escapedAt - b.st.escapedAt);
  const sum = k => ps.reduce((s, p) => s + (p.st[k] || 0), 0);
  const correct = sum('correct'), wrong = sum('wrong'), deaths = sum('deaths');
  const acc = correct + wrong ? correct / (correct + wrong) : null;
  const fastest = esc[0] ? { p: esc[0], t: esc[0].st.escapedAt - startAt } : null;
  const trapRank = TRAP_IDS.map(id => { let n = 0, who = 0; ps.forEach(p => { const c = p.st.traps?.[id] || 0; n += c; if (c) who++; }); return { id, n, who }; }).filter(x => x.n).sort((a, b) => b.n - a.n);
  const missMap = {}; Object.values(R.miss || {}).forEach(m => { if (!m.e) return; (missMap[m.e] ??= { e: m.e, n: 0, g: {} }).n++; if (m.g) missMap[m.e].g[m.g] = (missMap[m.e].g[m.g] || 0) + 1; });
  const misses = Object.values(missMap).sort((a, b) => b.n - a.n).slice(0, 10);
  const accOf = p => (p.st.correct || 0) + (p.st.wrong || 0) ? (p.st.correct || 0) / ((p.st.correct || 0) + (p.st.wrong || 0)) : 0;
  const best = (arr, f) => { if (!arr.length) return []; const mx = Math.max(...arr.map(f)); return mx > 0 ? arr.filter(p => f(p) === mx) : []; };
  const awards = [];
  const add = (icon, title, list, desc) => { if (list.length) awards.push({ icon, title, names: list.map(p => p.name), desc }); };
  if (fastest) add('⚡', '번개 탈출', [fastest.p], fmtDur(fastest.t));
  add('🎯', '정확왕', best(ps.filter(p => (p.st.correct || 0) >= 5), accOf), '틀린 문장이 가장 적은 비율');
  add('😇', '한 번도 안 빠지고 탈출', esc.filter(p => !(p.st.deaths)), '함정 0번!');
  add('🔥', '불사조', best(esc, p => p.st.deaths || 0), '가장 많이 빠지고도 탈출');
  add('✍️', '문장왕', best(ps, p => p.st.correct || 0), '맞게 쓴 문장이 가장 많아요');
  add('🃏', '함정 수집왕', best(ps, p => Object.keys(p.st.traps || {}).length), '가장 많은 함정 카드');
  add('🎤', '또박또박 발음왕', best(ps, p => p.st.mic || 0), '말해서 가장 많이 썼어요');
  add('🧗', '거의 다 왔어!', best(ps.filter(p => !p.st.escapedAt), p => p.st.maxProg || 0), '탈출 직전까지 갔어요');
  return { ps, esc, correct, wrong, deaths, acc, fastest, trapRank, misses, awards, rank: rankList(ps) };
}

function fxHTML(kind){
  const list = FX[kind] || [], r = rng(kind.length * 13 + 3);
  return list.map(f => {
    if (f === 'rain') return `<div class="fx-rain">${Array.from({ length: 46 }, () => `<i style="left:${(r() * 100).toFixed(1)}%;animation-delay:${(r() * 1).toFixed(2)}s;animation-duration:${(.45 + r() * .3).toFixed(2)}s"></i>`).join('')}</div>`;
    if (f === 'flash') return `<div class="fx-flash"></div>`;
    if (f === 'fireflies') return `<div class="fx-ff">${Array.from({ length: 12 }, () => `<i style="left:${(r() * 100).toFixed(1)}%;top:${(30 + r() * 60).toFixed(1)}%;animation-delay:${(r() * 4).toFixed(1)}s"></i>`).join('')}</div>`;
    if (f === 'sparkle') return `<div class="fx-sp">${Array.from({ length: 10 }, () => `<i style="left:${(r() * 100).toFixed(1)}%;top:${(r() * 80).toFixed(1)}%;animation-delay:${(r() * 3).toFixed(1)}s">✦</i>`).join('')}</div>`;
    if (f === 'dust') return `<div class="fx-dust">${Array.from({ length: 14 }, () => `<i style="left:${(r() * 100).toFixed(1)}%;top:${(r() * 70).toFixed(1)}%;animation-delay:${(r() * 6).toFixed(1)}s"></i>`).join('')}</div>`;
    if (f === 'fog') return `<div class="fx-fog"></div>`;
    if (f === 'vignette') return `<div class="fx-vig"></div>`;
    return '';
  }).join('');
}
function splitEmoji(s){ try { return [...new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(s || '')].map(x => x.segment).filter(x => x.trim()); } catch (e) { return [s || '']; } }
function propsHTML(emo){ return `<div class="props">${splitEmoji(emo).map((e, i) => `<span style="animation-delay:${i * .6}s">${e}</span>`).join('')}</div>`; }
function defaultMood(){ return CUR && CUR.mode === 'chunk' ? 'happy' : 'nervous'; }
function buildStage(sceneId, o = {}){
  const el = document.createElement('div');
  const kind = o.kind || BGK[sceneId] || (CUR?.mode === 'chunk' ? 'castle' : 'storm');
  el.className = 'stage ' + (o.small ? 'small ' : '') + 'k-' + kind;
  el.innerHTML = bgSVG(kind) + fxHTML(kind) + (o.props === false ? '' : propsHTML(o.props ?? SCENES[sceneId]?.emo)) +
    billySVG(o.mood || defaultMood(), (o.walk ? 'walkin ' : '') + (o.cls || '')) +
    (o.bubble ? `<div class="bubble slab">${esc(o.bubble)}</div>` : '') + (o.extra || '');
  return el;
}
function stageHTML(sceneId, o){ return buildStage(sceneId, o).outerHTML; }
function confettiHTML(n = 40){ const r = rng(77), cs = ['#ff5e5e', '#ffd84d', '#6ee06e', '#5eb8ff', '#c38bff', '#ff9ad5']; return `<div class="confetti">${Array.from({ length: n }, () => `<i style="left:${(r() * 100).toFixed(1)}%;background:${cs[r() * cs.length | 0]};animation-delay:${(r() * 2).toFixed(2)}s;animation-duration:${(2 + r() * 2).toFixed(2)}s;transform:rotate(${(r() * 360) | 0}deg)"></i>`).join('')}</div>`; }
function billyAnim(cls, ms = 700){ const b = S.stageEl?.querySelector('.billy'); if (!b) return; b.classList.remove('walkin', 'oops', 'yay'); void b.getBoundingClientRect(); b.classList.add(cls); setTimeout(() => b.classList.remove(cls), ms); }
function mountStage(){
  const host = $('#stageHost'); if (!host) return;
  const st = cur(), key = (S.explore ? 'x' : '') + st.scene + '|' + (S.stageNonce || 0);
  if (S.stageKey !== key || !S.stageEl) { S.stageKey = key; S.stageEl = buildStage(st.scene, { walk: true, bubble: S.bubble }); S.bubble = null; }
  host.appendChild(S.stageEl);
}

  st.order = order;
  save({ correct: st.correct, escapedAt: TS, order, maxProg: MAXPROG, last, known: st.known, mic: st.mic || 0, scene: st.scene });
  feed(`🎉 ${S.name} 탈출! (${order}번째)`);
  stRender();
}
function stDead(){
  S.view = 'dead';
  const T = TRAPS[S.dead.trap];
  app.innerHTML = `${topBar()}<div class="st"><div class="dead" style="min-height:auto;padding-top:12px"><div style="width:100%">${stageHTML(S.dead.from, { mood: 'dead', cls: 'fallen', props: false, bubble: S.dead.said, extra: `<div class="trapfall">${T.e}</div><div class="dizzy">💫</div><div class="redflash"></div>` })}</div><div class="t creep">GAME OVER</div>
    <div class="slab" style="font-size:1.3rem">${esc(T.en)}</div>
    <div class="trapcard">${S.dead.isNew ? '<div style="font-weight:900;font-size:.85rem">🆕 새 함정 카드!</div>' : ''}<div class="e">${T.e}</div><div style="font-weight:900">${esc(T.n)}</div></div>
    <div class="mute">💀 Billy가 ${cur().deaths}번째 함정에 빠졌어요… 다른 길을 골라 봐요!</div>
    <button class="red go" id="deadwait" data-act="revive" disabled>⏳</button></div></div>`;
  stTick();
}
ACT.revive = () => { if (!S.dead || Date.now() < S.dead.until) return; S.dead = null; enterScene(); stRender(); };
function stEscaped(explore){
  S.view = 'esc';
  const st = cur();
  if (explore) { app.innerHTML = `${topBar()}<div class="st"><div class="scene center">${stageHTML(CUR.order[CUR.order.length - 1], { mood: 'wow', cls: 'runout', props: false, extra: confettiHTML(24) })}<h2>탐험 탈출 성공!</h2><p class="slab">${esc(ESC_EN)}</p><button class="red go" data-act="exStart">🗺️ 다시 탐험하기</button> <button class="ghost go" data-act="exStop">탐험 그만</button></div></div>`; return; }
  const t = S.room.startAt ? st.escapedAt - S.room.startAt : null;
  const lastScene = CUR.order[CUR.order.length - 1];
  app.innerHTML = `<div class="st"><div class="scene center" style="margin-top:20px">${stageHTML(lastScene, { mood: 'wow', cls: 'runout', props: false, extra: confettiHTML() })}
    <h1 class="creep" style="color:#fde68a;font-size:2.6rem">${esc(CUR.winLine)}</h1><p class="slab" style="font-size:1.2rem">${esc(ESC_EN)}</p>
    <h2>${st.order ? st.order + '번째로 탈출!' : '탈출 성공!'}</h2>
    <div class="bigstats"><div>⏱️<b style="font-size:1.6rem">${t != null && t > 0 ? fmtDur(t) : '-'}</b></div><div>💀<b>${st.deaths || 0}</b></div><div>✅<b>${st.correct || 0}</b></div><div>❌<b>${st.wrong || 0}</b></div></div>
    <p class="mute" style="margin-top:14px">🗺️ 기다리는 동안 가 보지 않은 길도 마음껏 가 봐요. 함정 카드도 더 모을 수 있어요! (탐험은 기록·순위에 들어가지 않아요)</p>
    <button class="red go" data-act="exStart">🗺️ 자유 탐험하기</button></div>${collHTML()}</div>`;
}
ACT.exStart = () => { S.bubble = null; S.explore = true; S.exSt = { ...fresh(), started: true, known: { ...S.st.known } }; S.dead = null; enterScene(); stRender(); };
ACT.exStop = () => { S.explore = false; S.exSt = null; S.dead = null; stRender(); };
function collHTML(){ return `<div class="scene"><h3>🃏 함정 도감 ${Object.keys(S.st.traps || {}).length} / ${TRAP_IDS.length}</h3><div class="coll">${TRAP_IDS.map(id => S.st.traps?.[id] ? `<div><div class="e">${TRAPS[id].e}</div>${esc(TRAPS[id].n)}</div>` : `<div><div class="e">❓</div>???</div>`).join('')}</div></div>`; }
ACT.coll = () => { ovEl.innerHTML = `<div class="ov" data-act="collBg"><div class="box">${collHTML()}<div class="center"><button data-act="collClose">닫기</button></div></div></div>`; };
ACT.collClose = () => { ovEl.innerHTML = ''; };
ACT.collBg = (a, el, e) => { if (e.target === el) ACT.collClose(); };
async function stResult(){
  if (S.view === 'result') return;
  S.view = 'result';
  const st = S.st;
  app.innerHTML = `<div class="st"><div class="scene center"><h2>결과를 불러오는 중…</h2></div></div>`;
  let rank = null, total = null;
  try { const snap = await db.ref(S.base).get(); const R = flatRoom(snap.val()) || {}; const list = rankList(playersArr(R).filter(p => p.st.started)); total = list.length; rank = list.findIndex(p => p.pid === S.pid) + 1 || null; } catch (e) {}
  S.result = true;
  const acc = (st.correct || 0) + (st.wrong || 0) ? (st.correct || 0) / ((st.correct || 0) + (st.wrong || 0)) : null;
  app.innerHTML = `<div class="st"><div class="scene center" style="margin-top:20px">${stageHTML(st.escapedAt ? CUR.order[CUR.order.length - 1] : (st.scene || START), { small: true, mood: st.escapedAt ? 'wow' : 'nervous', cls: st.escapedAt ? 'wave' : '', props: false, extra: st.escapedAt ? confettiHTML(24) : '' })}<h1 class="creep" style="color:#fda4af;font-size:2.6rem">${st.escapedAt ? esc(CUR.winLine) : "Time's up!"}</h1>
    <h2>${esc(S.name)} ${rank ? `· ${total}명 중 ${rank}등` : ''}</h2>
    <p>${st.escapedAt ? `🎉 ${st.order ? st.order + '번째로 ' : ''}탈출했어요!` : `📍 ${esc(SCENES[st.scene]?.place || '')}까지 갔어요 (${st.maxProg || 0}/${MAXPROG})`}</p>
    <div class="bigstats"><div>💀 Game Over<b>${st.deaths || 0}</b></div><div>✅ 맞은 문장<b>${st.correct || 0}</b></div><div>❌ 틀린 문장<b>${st.wrong || 0}</b></div><div>🎯 정확도<b>${pct(acc)}</b></div></div>
    <p class="mute" style="margin-top:12px">TV 화면을 봐요! 👀</p></div>${collHTML()}</div>`;
}


/* ============ 문장 고치기 (교사) ============ */
const ed = { draft: null };
async function loadSavedStory(){
  try { const v = (await db.ref(STORY_PATH()).get()).val(); applyStory(v || {}); } catch (e) {}
  const n = Object.keys(STORY).length, el = $('#edInfo');
  if (el) el.textContent = n ? `고친 장면 ${n}개가 적용돼 있어요` : '';
}
function edLabel(c){ return c.to === 'ESC' ? '🎉 탈출' : TRAPS[c.to] ? `💀 함정 (${TRAPS[c.to].e} ${TRAPS[c.to].n})` : `✅ 다음 → ${BASE_SCENES[c.to].place}`; }
ACT.edOpen = () => {
  const box = SCENE_ORDER.map((id, n) => {
    const sc = SCENES[id];
    return `<div class="panel" style="margin:10px 0" data-scene="${id}">
      <div class="row"><b class="place" style="font-size:1.3rem">${n + 1}. ${esc(sc.place)}</b>${id === 'd1' ? '<span class="mute small">(빨간 문으로 돌아가는 길)</span>' : ''}${CHECKPOINTS[id] ? '<span>🚩</span>' : ''}</div>
      <div class="lbl small mute" style="margin-top:6px">이야기 (영어)</div><textarea data-k="en" rows="2" class="edf">${esc(sc.en)}</textarea>
      <div class="lbl small mute">이야기 (한국어 도움말)</div><textarea data-k="ko" rows="2" class="edf">${esc(sc.ko)}</textarea>
      ${sc.c.map((c, i) => `<div style="margin-top:8px;padding:8px;border-radius:12px;background:var(--panel2)"><div class="small" style="font-weight:800">선택지 ${i + 1} · ${edLabel(c)}</div>
        <input data-k="f${i}" class="edf slab" value="${esc(c.f)}" placeholder="${CUR.mode === 'going' ? "I'm going to ~" : '영어 문장'}">
        ${CUR.mode === 'chunk' ? `<div class="row small" style="gap:6px"><span class="mute">눌러서 넣는 조각:</span><input data-k="t${i}" class="edf slab" style="flex:1" value="${esc(c.t)}" placeholder="예) twice a day / How often"></div>` : ''}
        <input data-k="p${i}" class="edf slab" value="${esc(c.p)}" placeholder="${esc(CUR.pLabel)}"></div>`).join('')}
    </div>`;
  }).join('');
  ovEl.innerHTML = `<div class="ov"><div class="box" style="max-width:900px">
    <div class="row" style="position:sticky;top:-22px;background:var(--panel);padding:8px 0;z-index:2"><h2 style="flex:1">✏️ 문장 고치기 <span class="small mute">${esc(CUR.title)}</span></h2><button class="ghost" data-act="edReset">원래대로</button><button data-act="edClose">닫기</button><button class="red" data-act="edSave">저장</button></div>
    <div class="mute small">${CUR.mode === 'going' ? "· 선택지 문장은 <b>I'm going to</b> 또는 <b>I'm not going to</b>로 시작해야 해요. 학생은 그 뒷부분을 똑같이 써야 통과해요." : '· <b>조각</b>은 문장 <b>맨 앞</b>(How often)이나 <b>맨 끝</b>(twice a day)에 있는 단어여야 해요. 학생은 조각을 누르고 나머지를 써요.'}<br>· 어느 선택지가 바른 길이고 함정인지는 그대로예요 (옆의 ✅ / 💀 표시). 함정 쪽 문장은 함정 이야기와 어울리게 고쳐 주세요.<br>· ${esc(CUR.pLabel.split(' (')[0])} 칸은 어려움 설정에서만 학생에게 보여요.<br>· 저장하면 다음에 만드는 수업 방부터 적용돼요.</div>
    <div class="fb" id="edMsg" style="color:#fda4af"></div>${box}
    <div class="center"><button class="red" data-act="edSave">저장</button></div></div></div>`;
  ovEl.querySelectorAll('.edf').forEach(el => { el.style.cssText = 'width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0f151d;color:var(--text);font-size:1rem;margin:3px 0;font-family:inherit'; if (el.tagName === 'INPUT') el.style.fontFamily = '"Roboto Slab",Georgia,serif'; });
};
ACT.edClose = () => { ovEl.innerHTML = ''; };
ACT.edSave = async (a, btn) => {
  const out = {}, errs = [];
  ovEl.querySelectorAll('[data-scene]').forEach(box => {
    const id = box.dataset.scene, b = BASE_SCENES[id], get = k => fixApos(box.querySelector(`[data-k="${k}"]`).value);
    const o = {}, en = get('en'), ko = box.querySelector('[data-k="ko"]').value.trim();
    if (en && en !== b.en) o.en = en;
    if (ko !== b.ko) o.ko = ko;
    const cs = b.c.map((c, i) => {
      const f = get('f' + i), p = box.querySelector(`[data-k="p${i}"]`).value.trim(), x = {};
      const tEl = box.querySelector(`[data-k="t${i}"]`), t = tEl ? get('t' + i) : '';
      if (CUR.mode === 'going') { if (!/^I'm (not )?going to \S/.test(f)) errs.push(`${b.place} 선택지 ${i + 1}: I'm going to ~ 로 시작해야 해요`); }
      else { const sp = splitChoice({ f, t }); if (!sp.tiles.length || !sp.rest) errs.push(`${b.place} 선택지 ${i + 1}: 조각이 문장 맨 앞이나 맨 끝에 있어야 해요`); if (t && t !== c.t) x.t = t; }
      if (f && f !== c.f) x.f = f;
      if (p && p !== c.p) x.p = p;
      return x;
    });
    if (cs[0].f && cs[1].f && norm(cs[0].f) === norm(cs[1].f)) errs.push(`${b.place}: 두 선택지가 똑같아요`);
    if (cs.some(x => Object.keys(x).length)) o.c = cs;
    if (Object.keys(o).length) out[id] = o;
  });
  if (errs.length) { $('#edMsg').innerHTML = '⚠️ ' + errs.map(esc).join('<br>⚠️ '); ovEl.querySelector('.box').scrollTop = 0; return; }
  btn.disabled = true;
  try { await db.ref(STORY_PATH()).set(Object.keys(out).length ? out : null); applyStory(out); ovEl.innerHTML = ''; loadSavedStory(); }
  catch (e) { $('#edMsg').textContent = '저장하지 못했어요: ' + e.message; btn.disabled = false; }
};
ACT.edReset = async () => {
  if (!confirm('모든 문장을 처음 문장으로 되돌릴까요?')) return;
  try { await db.ref(STORY_PATH()).remove(); } catch (e) {}
  applyStory({}); ovEl.innerHTML = ''; loadSavedStory();
};

/* ============ 시작 ============ */
(function main(){
  if (!fbInit()) return;
  const tvCode = params.get('tv'), room = params.get('room');
  if (tvCode) tvStart(tvCode);
  else if (room) stStart(room);
  else { tvSetup(); loadSavedStory(); }
})();
</script>
